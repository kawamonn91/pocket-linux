# VM の生成物（カーネル・system.erofs・data.img.gz・libqemu.so）をビルドし、起動テストが通ったら
# GitHub Releases に置く。アプリは vm/artifacts.properties の版と SHA-256 で取ってくる（app/build.gradle.kts）。
#
# 使い方: Actions の画面か `gh workflow run vm-release.yml -f tag=vm-2` で動かし、
# 終わったら vm/scripts/pin-artifacts.sh <タグ> で vm/artifacts.properties を書き換えて PR にする。
#
# 同じ場所に、対応するソースの tar も置く（Linux・QEMU などの GPL の義務。docs/vm-plan.md の 8 章）。
name: vm-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースのタグ（vm-2 など）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  guest:
    uses: ./.github/workflows/guest.yml

  qemu:
    uses: ./.github/workflows/qemu.yml

  release:
    name: リリースに置く
    needs: [guest, qemu]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: ソースを取ってくる
        run: |
          FETCH_ONLY=1 bash vm/scripts/build-kernel.sh
          FETCH_ONLY=1 bash vm/scripts/build-qemu.sh arm64-v8a

      - name: 置くものを集める
        run: |
          mkdir dist
          cp artifacts/vm-guest/Image artifacts/vm-guest/system.erofs artifacts/vm-guest/data.img.gz \
            artifacts/vm-guest/kernel.config dist/
          cp artifacts/libqemu-arm64-v8a/libqemu.so dist/libqemu-arm64-v8a.so
          cp artifacts/libqemu-x86_64/libqemu.so dist/libqemu-x86_64.so
          cp vm/build/dl/* dist/
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - name: リリースを作る
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "VM の生成物 $TAG" --prerelease \
            --notes "Pocket Linux の VM の生成物（コミット $GITHUB_SHA）。アプリは vm/artifacts.properties の SHA-256 で取ってくる。Linux・QEMU などのソースの tar も同じ場所に置いている。"
