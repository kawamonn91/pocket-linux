# PR と main への push のたびに、単体テスト・lint・デバッグ版のビルドを行う。
# main は「build」が通らないとマージできない設定にしてあり、PR は自動マージを予約しておくと
# ここが通った時点でマージされる（docs/ci.md を参照）。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # 同じ PR に続けて push したら、古い実行は止める
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      # アクションは改ざんに備えてコミットの SHA で固定する（コメントは版）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      # Gradle の準備とキャッシュ。gradle-wrapper.jar が公式のものかも確かめる
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # 足りない SDK（compileSdk 37）と NDK（terminal-emulator の ndkVersion）は AGP が取得する
      - name: 単体テスト・lint・デバッグ版のビルド
        run: ./gradlew --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: デバッグ版の APK を残す
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: テストと lint のレポートを残す
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
          if-no-files-found: ignore
